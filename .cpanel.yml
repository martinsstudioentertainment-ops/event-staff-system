---
# Namecheap cPanel — deploy after "Pull" in Git Version Control.
# Replace YOUR_CPANEL_USER with your cPanel username (see /home/username in File Manager).

deployment:
  tasks:
    - export DEPLOYPATH=/home/olastofx/public_html/
    - /bin/cp -R admin api assets cron database docs includes lang vendor storage $DEPLOYPATH
    - /bin/cp -f .htaccess sw.js config.production.example.php $DEPLOYPATH
    - /bin/cp -f *.php $DEPLOYPATH
