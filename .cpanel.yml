---
# Namecheap cPanel — deploy after "Pull" in Git Version Control.
# Replace YOUR_CPANEL_USER with your cPanel username (see /home/username in File Manager).

deployment:
  tasks:
    - export DEPLOYPATH=/home/olastofx/public_html/
    - /bin/cp -R admin api assets check-in.php config.production.example.php cron database docs events-page.php faq.php home.php how-it-works.php includes index.php manifest.php offline.php privacy.php setup-check.php staff-app.php status.php submit.php sw.js vendor lang storage $DEPLOYPATH
