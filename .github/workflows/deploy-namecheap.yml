# Deploy to Namecheap shared hosting (FTP) on push to main.
#
# Setup (one time):
#   GitHub repo → Settings → Secrets → Actions:
#     FTP_SERVER      e.g. ftp.yourdomain.com
#     FTP_USERNAME    cPanel FTP user
#     FTP_PASSWORD    FTP password
#     FTP_SERVER_DIR  e.g. /public_html/  (must end with /)
#
# Optional — auto-upload config.php (never commit passwords to git):
#     DB_HOST                  default localhost
#     DB_NAME                  e.g. olastofx_eventstaff
#     DB_USER                  e.g. olastofx_dbuser
#     DB_PASS                  cPanel MySQL password
#     REGISTRATION_SITE_URL    e.g. https://olasentra.com
#     ADMIN_SITE_URL           e.g. https://olasentra.com/admin

name: Deploy to Namecheap

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.repository != ''

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate config.php from secrets
        if: ${{ secrets.DB_PASS != '' }}
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
          REGISTRATION_SITE_URL: ${{ secrets.REGISTRATION_SITE_URL }}
          ADMIN_SITE_URL: ${{ secrets.ADMIN_SITE_URL }}
        run: php scripts/generate-production-config.php

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          protocol: ftp
          port: 21
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.github/**
            **/.gitignore
            **/.cursor/**
            .env
            .env.*
            storage/logs/**
            storage/backups/**
            storage/google/**
            database/setup.php
            database/setup.bat
            start-dev.bat
            DEPLOY.md
            docs/**
