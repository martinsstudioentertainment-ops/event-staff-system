<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A.3 Screenshot — Step 2 Events</title>
<link rel="stylesheet" href="_preview-styles.css">
<link rel="stylesheet" href="../../../assets/css/registration-wizard.css">
</head>
<body class="registration-page--wizard">
<div class="preview-frame preview-frame--mobile">
<header class="staff-public-hero">
<p class="staff-public-hero__eyebrow">PSA security · DSP &amp; Static</p>
<h1 class="staff-public-hero__title">Register for event work</h1>
</header>
<section class="staff-public-card">
<div class="reg-wizard">
<div class="reg-wizard__progress-meta"><span class="reg-wizard__step-label">Step 2 of 8</span><span class="reg-wizard__step-name">Your gigs</span></div>
<div class="reg-wizard__bar"><span class="reg-wizard__bar-fill" style="width:25%"></span></div>
</div>
<h3 class="reg-wizard__step-title">Pick your shifts</h3>
<div class="reg-event-cards">
<label class="reg-event-card reg-event-card--selected" data-event-id="12">
<input type="checkbox" class="reg-event-card__input" checked>
<div class="reg-event-card__body">
<h4 class="reg-event-card__title">Electric Picnic 2026</h4>
<dl class="reg-event-card__meta"><dt>Venue</dt><dd>Stradbally Hall</dd><dt>Date</dt><dd>Sat 5 Sep 2026</dd><dt>County</dt><dd>Laois</dd><dt>Roles</dt><dd>DSP Security</dd></dl>
<span class="reg-event-card__status reg-event-card__status--open">Open for registration</span>
</div>
<span class="reg-event-card__check"></span>
</label>
<label class="reg-event-card reg-event-card--registered" data-event-id="8">
<input type="checkbox" class="reg-event-card__input" disabled>
<div class="reg-event-card__body">
<h4 class="reg-event-card__title">Longitude 2026</h4>
<dl class="reg-event-card__meta"><dt>Venue</dt><dd>Marlay Park</dd><dt>Date</dt><dd>Sun 5 Jul 2026</dd><dt>County</dt><dd>Dublin</dd><dt>Roles</dt><dd>Static Security</dd></dl>
<span class="reg-event-card__status reg-event-card__status--registered">Already Registered</span>
</div>
<span class="reg-event-card__check"></span>
</label>
</div>
<p class="reg-duplicate-tip" role="status">Already Registered for this event — pick a different opportunity.</p>
<nav class="reg-wizard__nav">
<button type="button" class="btn btn--secondary reg-wizard__btn-back">Back</button>
<button type="button" class="btn btn--primary">Continue</button>
</nav>
</section>
</div>
</body>
</html>
